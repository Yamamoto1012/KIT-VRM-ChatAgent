version: '3.8'

services:
  aivis:
    image: ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
    restart: always
    ports:
      - "10101:10101"
    volumes:
      - ~/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10101/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  fastapi:
    build:
      context: ./fast-api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - AIVIS_ENGINE_URL=http://aivis:10101
      - DIFY_API_URL=${DIFY_API_URL}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_WORKFLOW_ID=${DIFY_WORKFLOW_ID}
      - DIFY_VOICE_WORKFLOW_ID=${DIFY_VOICE_WORKFLOW_ID}
      - ENABLE_STREAMING=true
      - STREAM_CHUNK_SIZE=1024
      - STREAM_TIMEOUT=60.0
      - VERIFY_SSL=false
    depends_on:
      aivis:
        condition: service_healthy
    volumes:
      - ./fast-api:/app
      - ./toukou_pn.txt:/app/../toukou_pn.txt:ro
      - ./pn_ja.dic:/app/../pn_ja.dic:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/llm/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aivis-data:
    driver: local